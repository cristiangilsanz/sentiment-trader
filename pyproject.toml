[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentiment-trader"
dynamic = ["version"]
description = "Turn the sentiment of social posts into a backtested stock trading strategy."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Cristian Gil Sanz" }]
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "vaderSentiment>=3.3",
]

[project.optional-dependencies]
prices = ["yfinance>=0.2.40"]
transformers = ["transformers>=4.40", "torch>=2.2"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
sentiment-trader = "sentiment_trader.cli:main"

[tool.setuptools.dynamic]
version = { attr = "sentiment_trader.__version__" }

[tool.setuptools.package-data]
sentiment_trader = ["data/*.csv"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
